name: Supabase Keep-Alive

  "on":
    schedule:
      - cron: '0 9 */3 * *'
    workflow_dispatch:

  jobs:
    ping:
      runs-on: ubuntu-latest
      steps:
        - name: Ping Supabase REST API
          run: |
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              "https://pdxnpnlwrtswwifevlil.supabase.co/rest/v1/user_data?select=user_id&limit=1")
            echo "Supabase ping status: $STATUS"
            if [ "$STATUS" != "200" ] && [ "$STATUS" != "406" ]; then
              exit 1
            fi
            echo "Supabase is alive!"

  pages.yml de aynı sorun varsa onu da şununla değiştir:

  name: Deploy to GitHub Pages

  "on":
    push:
      branches: [main]
    workflow_dispatch:

  permissions:
    contents: read
    pages: write
    id-token: write

  concurrency:
    group: pages
    cancel-in-progress: false

  jobs:
    deploy:
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/configure-pages@v4
        - uses: actions/upload-pages-artifact@v3
          with:
            path: '.'
        - id: deployment
          uses: actions/deploy-pages@v4
